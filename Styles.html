<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15202b; --muted:#5d6876; --faint:#8a94a1; --line:#e2e5e9; --bg:#f5f6f2; --card:#fff; --soft:#f1f3f0;
  --accent:#0f766e; --accent-soft:#e2f3f0; --accent-ink:#0b4f49;
  --ok:#15803d; --ok-soft:#e6f4ea; --warn:#b45309; --warn-soft:#fdf1e1; --bad:#b91c1c; --bad-soft:#fdecec;
  --w3green:#04AA6D; --w3gray:#E7E9EB; --w3note:#fff9d6; --codebg:#ffffff;
  --r:12px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --head:'Lexend',system-ui,sans-serif; --body:'Source Sans 3',system-ui,sans-serif; --mono:'JetBrains Mono',Consolas,monospace;
}
body.g6{--accent:#0f766e;--accent-soft:#e2f3f0;--accent-ink:#0b4f49}
body.g7{--accent:#4338ca;--accent-soft:#e9e8fc;--accent-ink:#2f2894}
body.g8{--accent:#c2410c;--accent-soft:#fcebe0;--accent-ink:#8a2e08}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--head);line-height:1.25;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:1.7rem} h2{font-size:1.4rem} h3{font-size:1.1rem} h4{font-size:1rem}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:.88rem} .tiny{font-size:.78rem}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* top bar */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar .wrap{display:flex;align-items:center;gap:14px;min-height:62px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:600}
.badge-grade{background:var(--accent);color:#fff;border-radius:10px;padding:6px 11px;font-family:var(--head);font-weight:700;font-size:.95rem}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.88rem;background:var(--card);white-space:nowrap}
.pill b{font-family:var(--head)}

/* buttons & inputs */
.btn{font:600 .95rem var(--head);border:1px solid transparent;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:8px;text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.07)} .btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn.danger{background:var(--card);color:var(--bad);border-color:#f2c9c9}
.btn.sm{padding:6px 11px;font-size:.84rem;border-radius:8px}
.btn.w3{background:var(--w3green);border-radius:6px}
label{display:block;font:600 .85rem var(--head);color:var(--muted);margin:12px 0 5px}
input[type=text],input[type=email],input[type=url],input[type=number],input[type=date],select,textarea{
  width:100%;font:16px var(--body);color:var(--ink);background:#fff;border:1px solid #cfd5dc;border-radius:9px;padding:9px 11px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
textarea.code{font:14px/1.5 var(--mono);min-height:120px;tab-size:4}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.row{display:flex;gap:12px;flex-wrap:wrap} .row>*{flex:1;min-width:160px}
.check{display:flex;align-items:center;gap:8px;font:500 .95rem var(--body);color:var(--ink);margin:10px 0}
.check input{width:18px;height:18px;accent-color:var(--accent)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.card+.card{margin-top:16px}
.grid{display:grid;gap:16px}
.stat{padding:16px 18px}
.stat .k{font:500 .8rem var(--head);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font:700 1.7rem var(--head);margin-top:2px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.93rem;background:#fff}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .8rem var(--head);color:var(--muted);background:var(--soft);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}

.tag{display:inline-block;border-radius:6px;padding:2px 8px;font:600 .78rem var(--head);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.neutral{background:var(--soft);color:var(--muted)}
.tag.acc{background:var(--accent-soft);color:var(--accent-ink)}

/* ---------- W3Schools-style lesson blocks ---------- */
.prose p{margin:0 0 .9em} .prose ul,.prose ol{margin:0 0 1em;padding-left:1.4em} .prose li{margin:.25em 0}
.prose h3{margin-top:1.2em}
.prose code,.inline-code{font:.88em var(--mono);color:#c7254e;background:#f4f4f4;padding:1px 5px;border-radius:4px}
.w3-syntax{background:var(--w3gray);border-radius:6px;padding:14px 18px;margin:18px 0}
.w3-syntax .lbl,.w3-example .lbl{font:600 .78rem var(--head);text-transform:uppercase;letter-spacing:.06em;color:#3b4450;margin-bottom:6px}
.w3-example{background:var(--w3gray);border-radius:6px;padding:14px 18px 18px;margin:18px 0}
.w3-example h3{font-size:1.05rem;margin:0 0 10px}
.w3-code{background:var(--codebg);border-left:4px solid var(--w3green);padding:12px 14px;margin-bottom:14px;overflow-x:auto}
pre.code{margin:0;font:14.5px/1.6 var(--mono);white-space:pre;color:#000}
.w3-syntax pre.code{white-space:pre-wrap}
pre.code .k{color:#0000cd} pre.code .b{color:#7a3e9d} pre.code .s{color:#a52a2a}
pre.code .n{color:#ff4500} pre.code .c{color:#008000;font-style:italic}
.w3-note{background:var(--w3note);border-left:4px solid #e0c34c;padding:12px 16px;margin:18px 0;border-radius:0 6px 6px 0}
.video{position:relative;padding-top:56.25%;background:#000;border-radius:10px;overflow:hidden;margin:6px 0 20px}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}

/* toast & loading */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2733;color:#fff;padding:11px 18px;border-radius:10px;font-size:.93rem;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1} #toast.bad{background:var(--bad)} #toast.ok{background:var(--ok)}
.spinner{width:22px;height:22px;border:3px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;gap:12px;color:var(--muted);padding:40px;justify-content:center}
.empty{border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}

@media print{ body.guarded{display:none!important} }
@media (max-width:760px){ html,body{font-size:16px} h1{font-size:1.4rem} .card{padding:16px} }
</style>
