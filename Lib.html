<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ===== Shared helpers (student + teacher pages) ===== */
function $(s, el){ return (el || document).querySelector(s); }
function $$(s, el){ return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/** Promise wrapper for google.script.run */
function run(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(resolve, reject){
    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e){ reject(e && e.message ? e.message : String(e)); });
    r[fn].apply(r, args);
  });
}

var _toastT;
function toast(msg, kind){
  var t = $('#toast'); t.textContent = msg; t.className = 'show ' + (kind || '');
  clearTimeout(_toastT); _toastT = setTimeout(function(){ t.className = ''; }, kind === 'bad' ? 5000 : 2800);
}

/* ---------- Python syntax highlighter (W3Schools colour scheme) ---------- */
var PY_KW = {}, PY_BI = {};
'False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case'.split(' ').forEach(function(k){ PY_KW[k]=1; });
'print input len range int float str bool list dict set tuple type abs round min max sum sorted enumerate zip open format'.split(' ').forEach(function(k){ PY_BI[k]=1; });
function hl(code){
  var re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|[rRbBfFuU]?"(?:\\.|[^"\\\n])*"|[rRbBfFuU]?'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([\s\S])/g;
  var out = '', m;
  code = String(code || '');
  while ((m = re.exec(code))){
    if (m[1]) out += '<span class="c">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="s">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="n">' + m[3] + '</span>';
    else if (m[4]) out += PY_KW.hasOwnProperty(m[4]) ? '<span class="k">' + m[4] + '</span>' : PY_BI.hasOwnProperty(m[4]) ? '<span class="b">' + m[4] + '</span>' : m[4];
    else out += esc(m[5]);
  }
  return out;
}

/* ---------- Mini-markdown for teacher-written explanations ----------
   **bold**  *italic*  `code`  [text](https://link)  - bullets  1. numbers  ### heading
   ```python ... ``` code blocks                                            */
function mdInline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code class="notranslate" translate="no">$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function mdBlock(t){
  var lines = t.split('\n'), html = '', para = [], list = null;
  function flushP(){ if (para.length){ html += '<p>' + mdInline(para.join(' ')) + '</p>'; para = []; } }
  function flushL(){ if (list){ html += '<' + list.tag + '>' + list.items.map(function(i){ return '<li>' + mdInline(i) + '</li>'; }).join('') + '</' + list.tag + '>'; list = null; } }
  lines.forEach(function(line){
    var l = line.trim(), m;
    if (!l){ flushP(); flushL(); return; }
    if ((m = l.match(/^(#{1,3})\s+(.*)$/))){ flushP(); flushL(); html += (m[1].length === 1 ? '<h3>' : '<h4>') + mdInline(m[2]) + (m[1].length === 1 ? '</h3>' : '</h4>'); return; }
    if ((m = l.match(/^[-*]\s+(.*)$/))){ flushP(); if (!list || list.tag !== 'ul'){ flushL(); list = {tag:'ul', items:[]}; } list.items.push(m[1]); return; }
    if ((m = l.match(/^\d+[.)]\s+(.*)$/))){ flushP(); if (!list || list.tag !== 'ol'){ flushL(); list = {tag:'ol', items:[]}; } list.items.push(m[1]); return; }
    flushL(); para.push(l);
  });
  flushP(); flushL();
  return html;
}
function md(src){
  var parts = String(src || '').replace(/\r/g, '').split(/```(?:python|py)?[ \t]*\n?/);
  return parts.map(function(p, i){
    return i % 2 ? '<div class="w3-code"><pre class="code notranslate" translate="no">' + hl(p.replace(/\n$/, '')) + '</pre></div>' : mdBlock(p);
  }).join('');
}

/** YouTube / Google Drive / direct video → embeddable URL */
function embedUrl(url){
  url = String(url || '').trim(); if (!url) return '';
  var m;
  if ((m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/))) return 'https://www.youtube-nocookie.com/embed/' + m[1] + '?rel=0&modestbranding=1';
  if ((m = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]+)/))) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
  if ((m = url.match(/docs\.google\.com\/presentation\/d\/([\w-]+)/))) return 'https://docs.google.com/presentation/d/' + m[1] + '/embed';
  if ((m = url.match(/vimeo\.com\/(\d+)/))) return 'https://player.vimeo.com/video/' + m[1];
  return url;
}
function videoHtml(url){
  var e = embedUrl(url); if (!e) return '';
  if (/\.(mp4|webm|ogg)(\?|$)/i.test(e)) return '<div class="video"><video src="' + esc(e) + '" controls controlsList="nodownload" disablePictureInPicture></video></div>';
  return '<div class="video"><iframe src="' + esc(e) + '" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>';
}
function fmtMinutes(min){ min = Math.max(0, Math.round(min || 0)); var h = Math.floor(min / 60), m = min % 60; return h ? h + ' h ' + m + ' min' : m + ' min'; }
</script>
