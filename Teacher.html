<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<?!= include('Styles') ?>
<style>
body{--accent:#1f4e79;--accent-soft:#e4edf6;--accent-ink:#173b5c}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:14px;padding-bottom:2px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;font:600 .93rem var(--head);color:var(--muted);padding:10px 14px;border-radius:9px 9px 0 0;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
main{padding-top:20px;padding-bottom:60px}
.two{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
.two.wide{grid-template-columns:320px 1fr}
.stats{grid-template-columns:repeat(4,1fr);margin-bottom:16px}
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.toolbar>div{min-width:200px}
.toolbar label{margin-top:0}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;font:600 .8rem var(--head);padding:7px 10px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on[data-v=Present]{background:var(--ok);color:#fff}
.seg button.on[data-v=Late]{background:var(--warn);color:#fff}
.seg button.on[data-v=Absent]{background:var(--bad);color:#fff}
.seg button.on[data-v=Excused]{background:#64748b;color:#fff}
.topic-li{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font:500 .95rem var(--body)}
.topic-li:hover{border-color:var(--accent)}
.topic-li.on{border-color:var(--accent);background:var(--accent-soft)}
.topic-li .o{font:700 .8rem var(--head);color:var(--muted);min-width:22px}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
.qedit{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--soft)}
.qedit .row>*{min-width:120px}
.qhead{display:flex;justify-content:space-between;align-items:center;font:600 .85rem var(--head);color:var(--muted)}
.section-title{font:600 .78rem var(--head);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:22px 0 2px;padding-top:16px;border-top:1px solid var(--line)}
.feed-item{border-bottom:1px solid var(--line);padding:12px 0}
.feed-item:last-child{border-bottom:0}
.feed-text{white-space:pre-wrap;font-size:.94rem;max-height:7.5em;overflow:hidden}
details.cw{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff}
details.cw summary{cursor:pointer;list-style:none}
details.cw summary::-webkit-details-marker{display:none}
.linkbox{display:flex;gap:8px;margin:6px 0}
.linkbox input{font:13px var(--mono)}
@media (max-width:980px){ .two,.two.wide{grid-template-columns:1fr} .stats{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <div class="brand"><span class="badge-grade">Teacher Portal</span>
    <div><div style="font-size:1.05rem">Booster Classes · Grades 6–8</div><div class="tiny muted"><?= school ?></div></div></div>
  <div class="spacer"></div>
  <span id="previews" class="actions"></span>
  <span class="pill" id="who"></span>
</div></header>
<nav class="wrap tabs" id="tabs"></nav>
<main class="wrap" id="main"><div class="loading"><span class="spinner"></span> Loading…</div></main>

<?!= include('Lib') ?>
<script>
var BOOT = <?!= boot ?>;
var S = { d:null, tab:'dash', cls:'', grade:'', topicId:null, courses:null, attDate:'', report:null, q:[] };
var TABS = [['dash','Dashboard'],['classes','Classes'],['students','Students'],['attendance','Attendance'],['topics','Topics & Assessments'],['classroom','Google Classroom'],['admin','Admin & Downloads']];
var STATUSES = ['Present','Late','Absent','Excused'];

function opt(v, label, sel){ return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(label) + '</option>'; }
function classLabel(c){ return 'G' + c.grade + ' · ' + c.name; }
function classById(id){ return S.d.classes.filter(function(c){ return c.id === id; })[0]; }
function classOptions(sel){ return S.d.classes.map(function(c){ return opt(c.id, classLabel(c), sel); }).join(''); }
function gradeOptions(sel){ return S.d.user.grades.map(function(g){ return opt(g, 'Grade ' + g, sel); }).join(''); }
function val(id){ var e = document.getElementById(id); return e ? e.value.trim() : ''; }
function ensureClass(){ if (!S.cls || !classById(S.cls)) S.cls = S.d.classes[0] ? S.d.classes[0].id : ''; return S.cls; }
function noClasses(){ return '<div class="empty">Create a class first in the <a href="#" onclick="go(\'classes\');return false">Classes</a> tab.</div>'; }
function busy(btn, on, label){ if (!btn) return; btn.disabled = on; if (label) btn.textContent = label; }
function fail(e){ toast(String(e), 'bad'); }
function apply(d){ S.d = d; renderHeader(); }

/* ------------------------------ boot ------------------------------ */
run('getTeacherData').then(function(d){
  apply(d);
  S.grade = d.user.grades[0] || '6';
  S.attDate = d.today;
  go('dash');
}).catch(function(e){ $('#main').innerHTML = '<div class="card"><h3>Could not load the portal</h3><p class="muted">' + esc(e) + '</p></div>'; });

function renderHeader(){
  var u = S.d.user;
  $('#who').textContent = (u.name || u.email) + ' · ' + u.role;
  $('#previews').innerHTML = u.grades.map(function(g){ return '<a class="btn ghost sm" href="' + esc(S.d.url) + '?page=grade&grade=' + g + '">Grade ' + g + ' page</a>'; }).join('');
  $('#tabs').innerHTML = TABS.filter(function(t){ return t[0] !== 'admin' || u.role === 'admin'; })
    .map(function(t){ return '<button class="tab' + (S.tab === t[0] ? ' on' : '') + '" onclick="go(\'' + t[0] + '\')">' + t[1] + '</button>'; }).join('');
}
function go(tab){
  S.tab = tab; renderHeader();
  ({dash:renderDash, classes:renderClasses, students:renderStudents, attendance:renderAttendance,
    topics:renderTopics, classroom:renderClassroom, admin:renderAdmin})[tab]();
  window.scrollTo(0, 0);
}

/* ------------------------------ dashboard / reports ------------------------------ */
function renderDash(){
  var d = S.d, pub = d.topics.filter(function(t){ return t.published; }).length;
  var h = '<div class="grid stats">' +
    stat('My classes', d.classes.length) + stat('Registered students', d.students.length) +
    stat('Published topics', pub + ' <span class="muted" style="font-size:1rem">/ ' + d.topics.length + '</span>') + stat('Target score', d.target + '%') + '</div>';
  if (!d.classes.length){ $('#main').innerHTML = h + noClasses(); return; }
  h += '<div class="card"><div class="toolbar"><div><label for="r-cls">Class report</label><select id="r-cls" onchange="loadReport(this.value)">' + classOptions(ensureClass()) + '</select></div>' +
       '<span class="spacer"></span><button class="btn ghost" onclick="downloadReport()">Download report (CSV)</button></div><div id="report"></div></div>';
  $('#main').innerHTML = h;
  loadReport(S.cls);
}
function stat(k, v){ return '<div class="card stat"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>'; }
function loadReport(id){
  S.cls = id;
  $('#report').innerHTML = '<div class="loading"><span class="spinner"></span> Building report…</div>';
  run('getReport', id).then(function(r){
    S.report = r;
    var s = r.summary;
    var h = '<p style="margin-top:0"><b>' + s.onTarget + ' of ' + s.assessed + '</b> assessed students are at <b>' + r.target + '%+</b>' +
            (s.classAverage !== null ? ' · class average <b>' + s.classAverage + '%</b>' : '') + ' · ' + s.totalHours + ' learning hours in total.</p>';
    if (!r.rows.length){ $('#report').innerHTML = h + '<div class="empty">No students in this class yet.</div>'; return; }
    h += '<div class="tbl-wrap"><table><thead><tr><th>Student</th><th class="num">Hours</th><th class="num">Topics done</th><th class="num">Avg best score</th>' +
         '<th class="num">Assessed</th><th class="num">Attempts</th><th class="num">Attendance</th><th class="num">Integrity flags</th><th>Status</th></tr></thead><tbody>' +
         r.rows.map(function(x){
           var cls = x.status === 'On target' ? 'ok' : x.status === 'Close' ? 'warn' : x.status === 'Needs support' ? 'bad' : 'neutral';
           return '<tr><td><b>' + esc(x.name) + '</b><div class="tiny muted">' + esc(x.email) + '</div></td>' +
             '<td class="num">' + fmtMinutes(x.minutes) + '</td><td class="num">' + x.completed + ' / ' + x.topics + '</td>' +
             '<td class="num">' + (x.average === null ? '–' : x.average + '%') + '</td><td class="num">' + x.assessed + '</td><td class="num">' + x.attempts + '</td>' +
             '<td class="num">' + (x.attendance === null ? '–' : x.attendance + '%') + '</td>' +
             '<td class="num">' + (x.flags ? '<span class="tag warn">' + x.flags + '</span>' : '0') + '</td>' +
             '<td><span class="tag ' + cls + '">' + esc(x.status) + '</span></td></tr>';
         }).join('') + '</tbody></table></div>' +
         '<p class="hint">Integrity flags count blocked copy/paste/right-click attempts and times the student left the page (details in the Integrity tab of the Sheet).</p>';
    $('#report').innerHTML = h;
  }).catch(function(e){ $('#report').innerHTML = '<div class="empty">' + esc(e) + '</div>'; });
}
function csvCell(v){ v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function downloadCsv(name, rows){
  var csv = '﻿' + rows.map(function(r){ return r.map(csvCell).join(','); }).join('\n');
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = name; a.target = '_blank';
  document.body.appendChild(a); a.click(); a.remove();
}
function downloadReport(){
  var r = S.report; if (!r) return;
  downloadCsv('booster-report-' + r.className.replace(/\W+/g, '-') + '.csv',
    [['Student','Email','Hours','Minutes','Topics completed','Published topics','Average best %','Assessed topics','Attempts','Attendance %','Integrity flags','Status']]
    .concat(r.rows.map(function(x){ return [x.name, x.email, (x.minutes / 60).toFixed(1), x.minutes, x.completed, x.topics, x.average, x.assessed, x.attempts, x.attendance, x.flags, x.status]; })));
}

/* ------------------------------ classes ------------------------------ */
function renderClasses(editId){
  var d = S.d, c = editId ? classById(editId) : null, admin = d.user.role === 'admin';
  var counts = {}; d.students.forEach(function(s){ counts[s.classId] = (counts[s.classId] || 0) + 1; });
  var h = '<div class="two"><div class="card"><h3>' + (c ? 'Edit class' : 'New class') + '</h3>' +
    '<input type="hidden" id="c-id" value="' + esc(c ? c.id : '') + '">' +
    '<label for="c-grade">Grade</label><select id="c-grade">' + gradeOptions(c ? c.grade : S.grade) + '</select>' +
    '<label for="c-name">Class name</label><input type="text" id="c-name" placeholder="e.g. 7A Booster – Python" value="' + esc(c ? c.name : '') + '">' +
    '<label for="c-subject">Subject</label><input type="text" id="c-subject" placeholder="Computer Science" value="' + esc(c ? c.subject : '') + '">' +
    '<label for="c-schedule">Schedule</label><input type="text" id="c-schedule" placeholder="e.g. Tue & Thu 15:30–16:30" value="' + esc(c ? c.schedule : '') + '">' +
    (admin ? '<label for="c-teacher">Teacher email (blank = you)</label><input type="email" id="c-teacher" value="' + esc(c ? c.teacher : '') + '">' : '') +
    '<label for="c-course">Google Classroom course ID</label><input type="text" id="c-course" placeholder="Pick below or paste the course ID" value="' + esc(c ? c.courseId : '') + '">' +
    '<div id="courseBox" style="margin-top:8px"><button class="btn ghost sm" onclick="pickCourse()">Choose from my Google Classroom</button></div>' +
    '<div class="actions" style="margin-top:18px"><button class="btn" id="c-save" onclick="saveClass()">' + (c ? 'Save changes' : 'Create class') + '</button>' +
    (c ? '<button class="btn ghost" onclick="renderClasses()">Cancel</button>' : '') + '</div></div>';
  h += '<div class="card"><h3>My classes</h3>' + (d.classes.length ? '<div class="tbl-wrap"><table><thead><tr><th>Class</th>' + (admin ? '<th>Teacher</th>' : '') +
       '<th>Schedule</th><th>Classroom</th><th class="num">Students</th><th></th></tr></thead><tbody>' +
    d.classes.map(function(x){
      return '<tr><td><b>' + esc(x.name) + '</b><div class="tiny muted">Grade ' + esc(x.grade) + ' · ' + esc(x.subject || '') + '</div></td>' +
        (admin ? '<td class="small">' + esc(x.teacher) + '</td>' : '') +
        '<td class="small">' + esc(x.schedule || '–') + '</td>' +
        '<td>' + (x.courseId ? '<span class="tag ok">Linked</span>' : '<span class="tag neutral">Not linked</span>') + '</td>' +
        '<td class="num">' + (counts[x.id] || 0) + '</td>' +
        '<td><div class="actions"><button class="btn ghost sm" onclick="renderClasses(\'' + esc(x.id) + '\')">Edit</button>' +
        '<button class="btn danger sm" onclick="deleteClass(\'' + esc(x.id) + '\')">Delete</button></div></td></tr>';
    }).join('') + '</tbody></table></div>' : '<div class="empty">No classes yet. Create your first class on the left.</div>') + '</div></div>';
  $('#main').innerHTML = h;
}
function pickCourse(){
  var box = $('#courseBox');
  if (S.courses) return showCourses();
  box.innerHTML = '<span class="spinner"></span> Loading your Classroom courses…';
  run('listMyCourses').then(function(c){ S.courses = c; showCourses(); })
    .catch(function(e){ box.innerHTML = '<div class="hint" style="color:var(--bad)">' + esc(e) + '</div><div class="hint">Make sure the account that deployed this app is a co-teacher in the course, or paste the course ID manually.</div>'; });
}
function showCourses(){
  var cur = val('c-course');
  $('#courseBox').innerHTML = S.courses.length
    ? '<select onchange="document.getElementById(\'c-course\').value=this.value"><option value="">— Select a course —</option>' +
      S.courses.map(function(c){ return opt(c.id, c.name + (c.section ? ' (' + c.section + ')' : ''), cur); }).join('') + '</select>'
    : '<div class="hint">No active Classroom courses found for your account.</div>';
}
function saveClass(){
  var b = $('#c-save'); busy(b, true, 'Saving…');
  run('saveClass', { id: val('c-id'), grade: val('c-grade'), name: val('c-name'), subject: val('c-subject'), schedule: val('c-schedule'),
                     teacher: val('c-teacher'), courseId: val('c-course') })
    .then(function(d){ apply(d); toast('Class saved.', 'ok'); renderClasses(); })
    .catch(function(e){ fail(e); busy(b, false, 'Save'); });
}
function deleteClass(id){
  var c = classById(id);
  if (!confirm('Delete class "' + c.name + '"?')) return;
  run('deleteClass', id).then(function(d){ apply(d); toast('Class deleted.', 'ok'); renderClasses(); }).catch(fail);
}

/* ------------------------------ students (registration) ------------------------------ */
function renderStudents(editEmail){
  var d = S.d;
  if (!d.classes.length){ $('#main').innerHTML = noClasses(); return; }
  ensureClass();
  var st = editEmail ? d.students.filter(function(s){ return s.email === editEmail; })[0] : null;
  var list = d.students.filter(function(s){ return s.classId === S.cls; }).sort(function(a, b){ return String(a.name).localeCompare(String(b.name)); });
  var h = '<div class="toolbar"><div><label for="s-filter">Class</label><select id="s-filter" onchange="S.cls=this.value;renderStudents()">' + classOptions(S.cls) + '</select></div></div>';
  h += '<div class="two"><div><div class="card"><h3>' + (st ? 'Edit student' : 'Register a student') + '</h3>' +
    '<input type="hidden" id="s-orig" value="' + esc(st ? st.email : '') + '">' +
    '<label for="s-name">Full name</label><input type="text" id="s-name" value="' + esc(st ? st.name : '') + '">' +
    '<label for="s-email">School Google email (their login)</label><input type="email" id="s-email" value="' + esc(st ? st.email : '') + '" placeholder="student@school.edu.vn">' +
    '<label for="s-class">Class</label><select id="s-class">' + classOptions(st ? st.classId : S.cls) + '</select>' +
    '<div class="actions" style="margin-top:16px"><button class="btn" id="s-save" onclick="saveStudent()">' + (st ? 'Save changes' : 'Register student') + '</button>' +
    (st ? '<button class="btn ghost" onclick="renderStudents()">Cancel</button>' : '') + '</div></div>' +
    '<div class="card"><h3>Register many at once</h3><p class="hint" style="margin-top:0">One student per line: <code class="inline-code">Name, email</code>. You can paste two columns straight from a spreadsheet. They join the class selected above.</p>' +
    '<textarea id="s-bulk" placeholder="Nguyen Van An, an.nguyen@school.edu.vn&#10;Tran Thi Binh, binh.tran@school.edu.vn"></textarea>' +
    '<button class="btn soft" style="margin-top:10px" id="s-bulkbtn" onclick="bulkAdd()">Add all</button><div id="bulkMsg"></div></div></div>';
  h += '<div class="card"><h3>' + esc(classLabel(classById(S.cls))) + ' <span class="muted" style="font-weight:400">· ' + list.length + ' students</span></h3>' +
    (list.length ? '<div class="tbl-wrap"><table><thead><tr><th>Student</th><th class="num">Learning time</th><th>Registered</th><th></th></tr></thead><tbody>' +
      list.map(function(s){
        return '<tr><td><b>' + esc(s.name) + '</b><div class="tiny muted">' + esc(s.email) + '</div></td><td class="num">' + fmtMinutes(s.minutes) + '</td>' +
          '<td class="small">' + esc(String(s.registeredOn || '').slice(0, 10)) + '</td>' +
          '<td><div class="actions"><button class="btn ghost sm" onclick="renderStudents(\'' + esc(s.email) + '\')">Edit / move</button>' +
          '<button class="btn danger sm" onclick="removeStudent(\'' + esc(s.email) + '\')">Remove</button></div></td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="empty">No students registered in this class yet.</div>') + '</div></div>';
  $('#main').innerHTML = h;
}
function saveStudent(){
  var b = $('#s-save'); busy(b, true, 'Saving…');
  run('saveStudent', { originalEmail: val('s-orig'), name: val('s-name'), email: val('s-email'), classId: val('s-class') })
    .then(function(d){ apply(d); toast('Student saved.', 'ok'); renderStudents(); })
    .catch(function(e){ fail(e); busy(b, false, 'Save'); });
}
function bulkAdd(){
  var b = $('#s-bulkbtn'); busy(b, true, 'Adding…');
  run('addStudentsBulk', S.cls, val('s-bulk')).then(function(d){
    apply(d); renderStudents();
    $('#bulkMsg').innerHTML = '<p class="small"><b>' + d.bulk.added + ' added.</b>' +
      (d.bulk.skipped.length ? ' Skipped: ' + d.bulk.skipped.map(esc).join('; ') : '') + '</p>';
  }).catch(function(e){ fail(e); busy(b, false, 'Add all'); });
}
function removeStudent(email){
  if (!confirm('Remove ' + email + ' from Booster? Their past hours, attendance and scores stay in the Sheet.')) return;
  run('removeStudent', email).then(function(d){ apply(d); toast('Student removed.', 'ok'); renderStudents(); }).catch(fail);
}

/* ------------------------------ attendance ------------------------------ */
var ATT = null;
function renderAttendance(){
  if (!S.d.classes.length){ $('#main').innerHTML = noClasses(); return; }
  ensureClass();
  $('#main').innerHTML = '<div class="card"><div class="toolbar">' +
    '<div><label for="a-cls">Class</label><select id="a-cls">' + classOptions(S.cls) + '</select></div>' +
    '<div><label for="a-date">Date</label><input type="date" id="a-date" value="' + esc(S.attDate) + '"></div>' +
    '<button class="btn ghost" onclick="loadAttendance()">Load</button><span class="spacer"></span>' +
    '<button class="btn ghost" onclick="markAll(\'Present\')">Mark all present</button><button class="btn" id="a-save" onclick="saveAttendance()">Save attendance</button></div>' +
    '<div id="att"></div></div>';
  loadAttendance();
}
function loadAttendance(){
  S.cls = val('a-cls'); S.attDate = val('a-date');
  $('#att').innerHTML = '<div class="loading"><span class="spinner"></span></div>';
  run('getAttendance', S.cls, S.attDate).then(function(a){ ATT = a; drawAttendance(); })
    .catch(function(e){ $('#att').innerHTML = '<div class="empty">' + esc(e) + '</div>'; });
}
function drawAttendance(){
  if (!ATT.students.length){ $('#att').innerHTML = '<div class="empty">No students in this class.</div>'; return; }
  $('#att').innerHTML = '<div class="tbl-wrap"><table><thead><tr><th>Student</th><th>Status</th><th class="num">Online that day</th></tr></thead><tbody>' +
    ATT.students.map(function(s, i){
      return '<tr><td><b>' + esc(s.name) + '</b><div class="tiny muted">' + esc(s.email) + '</div></td><td><div class="seg">' +
        STATUSES.map(function(v){ return '<button data-v="' + v + '" class="' + (s.status === v ? 'on' : '') + '" onclick="setAtt(' + i + ',\'' + v + '\')">' + v + '</button>'; }).join('') +
        '</div></td><td class="num">' + (s.online ? fmtMinutes(s.online) : '–') + '</td></tr>';
    }).join('') + '</tbody></table></div><p class="hint">"Online that day" is the time the student spent on their Booster page on that date.</p>';
}
function setAtt(i, v){ ATT.students[i].status = v; drawAttendance(); }
function markAll(v){ if (!ATT) return; ATT.students.forEach(function(s){ s.status = v; }); drawAttendance(); }
function saveAttendance(){
  if (!ATT) return;
  var b = $('#a-save'); busy(b, true, 'Saving…');
  run('saveAttendance', ATT.classId, ATT.date, ATT.students.map(function(s){ return { email: s.email, status: s.status }; }))
    .then(function(a){ ATT = a; drawAttendance(); toast('Attendance saved for ' + a.date + '.', 'ok'); })
    .catch(fail).then(function(){ busy(b, false, 'Save attendance'); });
}

/* ------------------------------ topics & assessments ------------------------------ */
function renderTopics(){
  var d = S.d;
  if (d.user.grades.indexOf(S.grade) < 0) S.grade = d.user.grades[0];
  var list = d.topics.filter(function(t){ return t.grade === S.grade; });
  var objs = d.objectives.filter(function(o){ return o.grade === S.grade; }).map(function(o){ return o.text; }).join('\n');
  var h = '<div class="toolbar"><div><label for="t-grade">Grade</label><select id="t-grade" onchange="S.grade=this.value;S.topicId=null;renderTopics()">' + gradeOptions(S.grade) + '</select></div>' +
    '<a class="btn ghost" href="' + esc(d.url) + '?page=grade&grade=' + esc(S.grade) + '">Preview Grade ' + esc(S.grade) + ' page</a></div>';
  h += '<div class="two wide"><div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Topics</h3>' +
    '<button class="btn sm" onclick="editTopic(null)">+ New topic</button></div><div style="margin-top:12px">' +
    (list.length ? list.map(function(t){
      return '<button class="topic-li' + (S.topicId === t.id ? ' on' : '') + '" onclick="editTopic(\'' + esc(t.id) + '\')"><span class="o">' + esc(t.order) + '</span>' +
        '<span style="flex:1">' + esc(t.title) + '<span class="tiny muted" style="display:block">' + t.questions + ' questions</span></span>' +
        (t.published ? '<span class="tag ok">Live</span>' : '<span class="tag neutral">Draft</span>') + '</button>';
    }).join('') : '<div class="empty">No topics for this grade yet.</div>') + '</div></div>' +
    '<div class="card"><h3>Grade ' + esc(S.grade) + ' lesson objectives</h3><p class="hint" style="margin-top:0">One objective per line. Students see these at the top of their grade page.</p>' +
    '<textarea id="o-text" placeholder="Add the lesson objectives for this grade later.">' + esc(objs) + '</textarea>' +
    '<button class="btn soft" style="margin-top:10px" id="o-save" onclick="saveObjectives()">Save objectives</button></div></div>' +
    '<div class="card" id="editor"></div></div>';
  $('#main').innerHTML = h;
  if (S.topicId && d.topics.some(function(t){ return t.id === S.topicId; })) editTopic(S.topicId); else editTopic(null);
}
function saveObjectives(){
  var b = $('#o-save'); busy(b, true, 'Saving…');
  run('saveObjectives', S.grade, $('#o-text').value).then(function(d){ apply(d); toast('Objectives saved.', 'ok'); })
    .catch(fail).then(function(){ busy(b, false, 'Save objectives'); });
}
function editTopic(id){
  S.topicId = id;
  $$('.topic-li').forEach(function(b){ b.classList.toggle('on', b.getAttribute('onclick').indexOf("'" + id + "'") >= 0); });
  var t = id ? S.d.topics.filter(function(x){ return x.id === id; })[0] : null;
  var nextOrder = S.d.topics.filter(function(x){ return x.grade === S.grade; }).reduce(function(m, x){ return Math.max(m, x.order); }, 0) + 1;
  var ta = function(id, label, value, cls, ph, hint){
    return '<label for="' + id + '">' + label + '</label><textarea id="' + id + '" class="' + (cls || '') + '" placeholder="' + esc(ph || '') + '">' + esc(value || '') + '</textarea>' + (hint ? '<div class="hint">' + hint + '</div>' : '');
  };
  var inp = function(id, label, value, ph, type){
    return '<label for="' + id + '">' + label + '</label><input type="' + (type || 'text') + '" id="' + id + '" value="' + esc(value || '') + '" placeholder="' + esc(ph || '') + '">';
  };
  var h = '<h3>' + (t ? 'Edit topic' : 'New Grade ' + esc(S.grade) + ' topic') + '</h3>' +
    '<div class="row"><div style="flex:3">' + inp('t-title', 'Topic title', t && t.title, 'e.g. Variables and Data Types') + '</div>' +
    '<div style="flex:1">' + inp('t-order', 'Order', t ? t.order : nextOrder, '', 'number') + '</div></div>' +
    '<label class="check"><input type="checkbox" id="t-pub"' + (t && t.published ? ' checked' : '') + '> Published (visible to students)</label>' +
    ta('t-obj', 'Topic objectives (optional)', t && t.objectives, 'You can leave this blank and add it later.', '', '') +

    '<div class="section-title">Video presentation</div>' +
    inp('t-video', 'Video link (YouTube, Google Drive or Google Slides)', t && t.videoUrl, 'https://www.youtube.com/watch?v=…', 'url') +
    '<div class="row" style="align-items:center;margin-top:8px"><div style="flex:0 0 auto"><input type="file" id="t-file" class="hidden" accept="video/*,.pdf,.ppt,.pptx,.doc,.docx,image/*" onchange="uploadLessonFile(this)">' +
    '<button class="btn ghost sm" onclick="$(\'#t-file\').click()">Upload a file…</button></div><div class="hint" id="t-upmsg" style="margin:0">Videos go into the video slot; slides, PDFs and images become the lesson file. Max 25 MB — upload longer videos to YouTube or Drive and paste the link.</div></div>' +

    '<div class="section-title">Topic breakdown (W3Schools style)</div>' +
    ta('t-expl', 'Explanation', t && t.explanation, 'Explain the idea in short, simple sentences…', '', 'Formatting: <b>**bold**</b>, <code class="inline-code">`code`</code>, lines starting with <code class="inline-code">- </code> become bullets, <code class="inline-code">### </code> makes a sub-heading, and <code class="inline-code">```python</code> … <code class="inline-code">```</code> makes a code block.') +
    ta('t-syntax', 'Syntax', t && t.syntax, 'print(value1, value2, ..., sep=" ")', 'code', 'The general pattern, shown in a grey Syntax box.') +
    ta('t-example', 'Example', t && t.example, '# Example\nname = "An"\nprint("Hello", name)', 'code', 'Shown in an Example box with a "Try it Yourself" button.') +
    ta('t-note', 'Note (common mistakes, tips)', t && t.note, 'Python is case-sensitive: Print() is not the same as print().', '', '') +

    '<div class="section-title">Resources</div>' +
    inp('t-res', 'Hodder Education / Boost link', t && t.resourceUrl, 'https://www.boost-learning.com/…', 'url') +
    inp('t-att', 'Lesson file link (slides, worksheet, PDF)', t && t.attachmentUrl, 'https://drive.google.com/…', 'url') +
    inp('t-try', '"Try it Yourself" link (optional)', t && t.customTryIt, 'Leave blank to use the default Python editor', 'url') +

    '<div class="section-title">Assessment (English only)</div>' +
    '<p class="hint">Multiple choice: fill options A–D and set the answer letter. Short answer: leave the options empty and type accepted answers separated by <code class="inline-code">|</code> (e.g. <code class="inline-code">print|print()</code>). Students must answer in English.</p>' +
    '<div id="qlist"><div class="loading"><span class="spinner"></span></div></div>' +
    '<div class="actions"><button class="btn ghost sm" onclick="addQ(false)">+ Multiple-choice question</button><button class="btn ghost sm" onclick="addQ(true)">+ Short-answer question</button></div>' +

    '<div class="actions" style="margin-top:24px;padding-top:16px;border-top:1px solid var(--line)">' +
    '<button class="btn" id="t-save" onclick="saveTopic()">Save topic</button>' +
    (t ? '<button class="btn danger" onclick="deleteTopic()">Delete topic</button>' : '') + '</div>';
  $('#editor').innerHTML = h;
  $$('textarea.code', $('#editor')).forEach(tabIndent);
  if (t){
    run('getQuestions', t.id).then(function(q){ if (S.topicId === t.id){ S.q = q; drawQ(); } }).catch(fail);
  } else { S.q = []; drawQ(); }
}
function tabIndent(el){
  el.addEventListener('keydown', function(e){
    if (e.key !== 'Tab') return;
    e.preventDefault();
    var s = el.selectionStart, en = el.selectionEnd;
    el.value = el.value.slice(0, s) + '    ' + el.value.slice(en);
    el.selectionStart = el.selectionEnd = s + 4;
  });
}
function readQ(){
  $$('.qedit').forEach(function(box, i){
    var g = function(k){ var e = box.querySelector('[data-k="' + k + '"]'); return e ? e.value : ''; };
    S.q[i] = { q: g('q'), a: g('a'), b: g('b'), c: g('c'), d: g('d'), answer: g('answer'), text: S.q[i] && S.q[i].text };
  });
}
function drawQ(){
  $('#qlist').innerHTML = S.q.length ? S.q.map(function(q, i){
    var isText = q.text || (!q.a && !q.b && !q.c && !q.d && q.q);
    q.text = !!isText;
    return '<div class="qedit"><div class="qhead"><span>Question ' + (i + 1) + ' · ' + (isText ? 'Short answer' : 'Multiple choice') + '</span>' +
      '<button class="btn danger sm" onclick="removeQ(' + i + ')">Remove</button></div>' +
      '<textarea data-k="q" style="min-height:60px;margin-top:8px" placeholder="Question text (you can use `code`)">' + esc(q.q) + '</textarea>' +
      (isText ? '' : '<div class="row" style="margin-top:8px">' + ['a','b','c','d'].map(function(k){
        return '<input type="text" data-k="' + k + '" placeholder="Option ' + k.toUpperCase() + '" value="' + esc(q[k]) + '">'; }).join('') + '</div>') +
      '<div style="margin-top:8px;max-width:' + (isText ? '100%' : '200px') + '"><input type="text" data-k="answer" placeholder="' + (isText ? 'Accepted answers, e.g. print|print()' : 'Answer: A, B, C or D') + '" value="' + esc(q.answer) + '"></div></div>';
  }).join('') : '<div class="empty" style="margin-bottom:10px">No questions yet. Add at least 5 so the score is meaningful.</div>';
}
function addQ(text){ readQ(); S.q.push({ q:'', a:'', b:'', c:'', d:'', answer:'', text: text }); drawQ(); }
function removeQ(i){ readQ(); S.q.splice(i, 1); drawQ(); }
function uploadLessonFile(input){
  var f = input.files[0]; if (!f) return;
  if (f.size > 25 * 1024 * 1024){ toast('That file is over 25 MB. Upload it to YouTube or Google Drive and paste the link instead.', 'bad'); input.value = ''; return; }
  var msg = $('#t-upmsg'); msg.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px"></span> Uploading ' + esc(f.name) + '…';
  var r = new FileReader();
  r.onload = function(){
    var b64 = String(r.result).split(',')[1];
    run('uploadFile', f.name, f.type, b64).then(function(res){
      if (res.isVideo) $('#t-video').value = res.url; else $('#t-att').value = res.url;
      msg.innerHTML = 'Uploaded <b>' + esc(res.name) + '</b> to Drive › Booster Uploads. Remember to save the topic.';
    }).catch(function(e){ msg.textContent = 'Upload failed: ' + e; });
  };
  r.readAsDataURL(f);
  input.value = '';
}
function saveTopic(){
  readQ();
  var b = $('#t-save'); busy(b, true, 'Saving…');
  var topic = { id: S.topicId, grade: S.grade, title: val('t-title'), order: val('t-order'), published: $('#t-pub').checked,
    objectives: $('#t-obj').value, videoUrl: val('t-video'), explanation: $('#t-expl').value, syntax: $('#t-syntax').value,
    example: $('#t-example').value, note: $('#t-note').value, resourceUrl: val('t-res'), attachmentUrl: val('t-att'), tryItUrl: val('t-try') };
  run('saveTopic', topic, S.q.map(function(q){ return { q: q.q, a: q.a, b: q.b, c: q.c, d: q.d, answer: q.answer }; }))
    .then(function(d){ apply(d); S.topicId = d.savedTopicId; toast('Topic saved.', 'ok'); renderTopics(); })
    .catch(function(e){ fail(e); busy(b, false, 'Save topic'); });
}
function deleteTopic(){
  var t = S.d.topics.filter(function(x){ return x.id === S.topicId; })[0];
  if (!t || !confirm('Delete "' + t.title + '" and its assessment questions? Past scores stay in the Sheet.')) return;
  run('deleteTopic', t.id).then(function(d){ apply(d); S.topicId = null; toast('Topic deleted.', 'ok'); renderTopics(); }).catch(fail);
}

/* ------------------------------ Google Classroom ------------------------------ */
function renderClassroom(){
  if (!S.d.classes.length){ $('#main').innerHTML = noClasses(); return; }
  ensureClass();
  $('#main').innerHTML = '<div class="card"><div class="toolbar"><div><label for="g-cls">Class</label><select id="g-cls">' + classOptions(S.cls) + '</select></div>' +
    '<button class="btn" onclick="loadFeed()">Load stream & submissions</button></div>' +
    '<p class="hint" style="margin-top:0">Link a class to its Google Classroom course in the Classes tab. Data is read live from Classroom.</p></div><div id="feed"></div>';
  var c = classById(S.cls); if (c && c.courseId) loadFeed();
}
function loadFeed(){
  S.cls = val('g-cls');
  var c = classById(S.cls);
  if (!c.courseId){ $('#feed').innerHTML = '<div class="card empty">This class is not linked to a Google Classroom course yet. <a href="#" onclick="go(\'classes\');return false">Link it in Classes</a>.</div>'; return; }
  $('#feed').innerHTML = '<div class="card loading"><span class="spinner"></span> Reading Google Classroom…</div>';
  run('getClassroomFeed', S.cls).then(function(f){
    var h = '<div class="card" style="margin-top:16px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">' +
      '<div><h3 style="margin:0">' + esc(f.course.name) + '</h3><div class="muted small">' + esc(f.course.section) + ' · ' + f.rosterSize + ' students in Classroom</div></div>' +
      '<a class="btn ghost" target="_blank" rel="noopener" href="' + esc(f.course.link) + '">Open in Classroom</a></div></div>';
    h += '<div class="two" style="margin-top:16px"><div class="card"><h3>Stream</h3>' +
      (f.announcements.length ? f.announcements.map(function(a){
        return '<div class="feed-item"><div class="tiny muted">' + esc(String(a.time || '').replace('T', ' ').slice(0, 16)) + '</div><div class="feed-text">' + esc(a.text) + '</div>' +
          '<a class="small" target="_blank" rel="noopener" href="' + esc(a.link) + '">Open post</a></div>';
      }).join('') : '<div class="empty">No announcements.</div>') + '</div>';
    h += '<div class="card"><h3>Classwork & submissions</h3>' + (f.work.length ? f.work.map(function(w){
      var c = w.counts;
      return '<details class="cw"><summary><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>' + esc(w.title) + '</b>' +
        '<span class="tiny muted">' + (w.due ? 'Due ' + esc(w.due) : 'No due date') + (w.maxPoints ? ' · ' + esc(w.maxPoints) + ' pts' : '') + '</span></div>' +
        '<div class="actions" style="margin-top:6px"><span class="tag ok">' + c.turnedIn + ' turned in</span><span class="tag acc">' + c.returned + ' returned</span>' +
        '<span class="tag bad">' + c.notSubmitted + ' not submitted</span>' + (c.late ? '<span class="tag warn">' + c.late + ' late</span>' : '') + '</div></summary>' +
        '<div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Student</th><th>Status</th><th class="num">Grade</th></tr></thead><tbody>' +
        w.students.map(function(s){
          var st = {TURNED_IN:['Turned in','ok'], RETURNED:['Returned','acc'], RECLAIMED_BY_STUDENT:['Unsubmitted','warn'], NEW:['Not submitted','bad'], CREATED:['Not submitted','bad']}[s.state] || [s.state,'neutral'];
          return '<tr><td>' + esc(s.name) + '<div class="tiny muted">' + esc(s.email) + '</div></td><td><span class="tag ' + st[1] + '">' + st[0] + '</span>' + (s.late ? ' <span class="tag warn">Late</span>' : '') + '</td>' +
            '<td class="num">' + esc(s.grade) + '</td></tr>';
        }).join('') + '</tbody></table></div><a class="small" target="_blank" rel="noopener" href="' + esc(w.link) + '">Open in Classroom</a></details>';
    }).join('') : '<div class="empty">No classwork yet.</div>') + '</div></div>';
    $('#feed').innerHTML = h;
  }).catch(function(e){
    $('#feed').innerHTML = '<div class="card"><h3>Could not read Google Classroom</h3><p class="muted">' + esc(e) + '</p>' +
      '<p class="hint">The account that deployed this web app must be a teacher or co-teacher in the course (or a Workspace admin), and the course ID must be correct.</p></div>';
  });
}

/* ------------------------------ admin ------------------------------ */
function renderAdmin(editEmail){
  var d = S.d; if (d.user.role !== 'admin') return go('dash');
  var t = editEmail ? d.teachers.filter(function(x){ return x.email === editEmail; })[0] : null;
  var s = d.settings, dl = d.downloads;
  var h = '<div class="two"><div class="card"><h3>' + (t ? 'Edit teacher' : 'Add a teacher') + '</h3>' +
    '<input type="hidden" id="tc-orig" value="' + esc(t ? t.email : '') + '">' +
    '<label for="tc-name">Name</label><input type="text" id="tc-name" value="' + esc(t ? t.name : '') + '">' +
    '<label for="tc-email">School Google email</label><input type="email" id="tc-email" value="' + esc(t ? t.email : '') + '">' +
    '<label>Grades they teach</label><div class="actions">' + ['6','7','8'].map(function(g){
      return '<label class="check" style="margin:4px 12px 4px 0"><input type="checkbox" class="tc-g" value="' + g + '"' + (t && t.grades.indexOf(g) >= 0 ? ' checked' : '') + '> Grade ' + g + '</label>'; }).join('') + '</div>' +
    '<div class="actions" style="margin-top:12px"><button class="btn" onclick="saveTeacher()">' + (t ? 'Save changes' : 'Add teacher') + '</button>' +
    (t ? '<button class="btn ghost" onclick="renderAdmin()">Cancel</button>' : '') + '</div></div>' +
    '<div class="card"><h3>Teachers</h3>' + (d.teachers.length ? '<div class="tbl-wrap"><table><thead><tr><th>Teacher</th><th>Grades</th><th></th></tr></thead><tbody>' +
      d.teachers.map(function(x){
        return '<tr><td><b>' + esc(x.name) + '</b><div class="tiny muted">' + esc(x.email) + '</div></td><td>' + x.grades.map(function(g){ return '<span class="tag acc">G' + g + '</span>'; }).join(' ') + '</td>' +
          '<td><div class="actions"><button class="btn ghost sm" onclick="renderAdmin(\'' + esc(x.email) + '\')">Edit</button><button class="btn danger sm" onclick="removeTeacher(\'' + esc(x.email) + '\')">Remove</button></div></td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="empty">No teachers yet. Add each Booster teacher so they can register students and edit topics.</div>') + '</div></div>';

  h += '<div class="two" style="margin-top:16px"><div class="card"><h3>Download the data</h3>' +
    '<p class="small muted" style="margin-top:0">Everything the web app records lives in the linked Google Sheet.</p>' +
    '<div class="actions"><a class="btn" target="_blank" href="' + esc(dl.xlsx) + '">Download everything (.xlsx)</a><a class="btn ghost" target="_blank" href="' + esc(dl.sheetUrl) + '">Open the Google Sheet</a></div>' +
    '<label>Single tabs as CSV</label><div class="actions">' + dl.tabs.map(function(x){ return '<a class="btn ghost sm" target="_blank" href="' + esc(x.csv) + '">' + esc(x.name) + '</a>'; }).join('') + '</div>' +
    '<label>Web page links to share</label>' +
    [['Teacher portal', d.url + '?page=teacher'], ['Grade 6', d.url + '?page=grade&grade=6'], ['Grade 7', d.url + '?page=grade&grade=7'], ['Grade 8', d.url + '?page=grade&grade=8']]
      .map(function(l){ return '<div class="linkbox"><span class="pill" style="min-width:120px">' + l[0] + '</span><input type="text" readonly value="' + esc(l[1]) + '" onclick="this.select()"></div>'; }).join('') +
    '</div>';
  h += '<div class="card"><h3>Settings</h3>' +
    '<label for="st-school">School / programme name</label><input type="text" id="st-school" value="' + esc(s.SchoolName) + '">' +
    '<label for="st-subject">Default subject</label><input type="text" id="st-subject" value="' + esc(s.DefaultSubject) + '">' +
    '<div class="row"><div><label for="st-target">Target score (%)</label><input type="number" id="st-target" min="1" max="100" value="' + esc(s.TargetPercent) + '"></div>' +
    '<div><label for="st-switch">Tab switches before auto-submit</label><input type="number" id="st-switch" min="1" max="20" value="' + esc(s.MaxTabSwitches) + '"></div></div>' +
    '<label for="st-try">Default "Try it Yourself" link</label><input type="url" id="st-try" value="' + esc(s.TryItUrl) + '">' +
    '<label for="st-admins">Administrator emails (comma-separated)</label><input type="text" id="st-admins" value="' + esc(s.AdminEmails) + '">' +
    '<button class="btn" style="margin-top:14px" onclick="saveSettings()">Save settings</button></div></div>';
  $('#main').innerHTML = h;
}
function saveTeacher(){
  run('saveTeacher', { originalEmail: val('tc-orig'), name: val('tc-name'), email: val('tc-email'),
    grades: $$('.tc-g').filter(function(c){ return c.checked; }).map(function(c){ return c.value; }) })
    .then(function(d){ apply(d); toast('Teacher saved.', 'ok'); renderAdmin(); }).catch(fail);
}
function removeTeacher(email){
  if (!confirm('Remove teacher ' + email + '? Their classes stay; reassign them by editing each class.')) return;
  run('removeTeacher', email).then(function(d){ apply(d); toast('Teacher removed.', 'ok'); renderAdmin(); }).catch(fail);
}
function saveSettings(){
  run('saveSettings', { SchoolName: val('st-school'), DefaultSubject: val('st-subject'), TargetPercent: val('st-target'),
    MaxTabSwitches: val('st-switch'), TryItUrl: val('st-try'), AdminEmails: val('st-admins') })
    .then(function(d){ apply(d); toast('Settings saved.', 'ok'); renderAdmin(); }).catch(fail);
}
</script>
</body>
</html>
